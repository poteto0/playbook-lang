[workspace]
members = [
    "core",
    "cli",
    "linter",
    "formatter",
]
resolver = "2"
# Default release profile (fast)
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

# Optimize for size (CLI only)
[profile.release-small]
inherits = "release"
opt-level = "z"
strip = true

[profile.bench]
inherits = "release"

